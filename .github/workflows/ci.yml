name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Code style, static analysis and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, zip, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create environment file
        run: cp .env.example .env

      - name: Check code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Warm up the Symfony container (needed by PHPStan)
        run: php bin/console cache:warmup --env=dev

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit --testsuite Unit
